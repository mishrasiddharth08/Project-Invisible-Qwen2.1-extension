<title id="title">Keep the edit aligned</title><desc id="desc">Optional corrections run before the image reaches the gallery and saved PNG.</desc>
<rect width="1200" height="780" rx="24" fill="#10151f"/>
<style>text{font-family:Arial,sans-serif}.title{fill:#e8ecf4;font-size:36px;font-weight:700}.sub{fill:#9fb0c9;font-size:20px}.label{fill:#8fa3c4;font-size:24px;font-weight:700}.body{fill:#dfe7f5;font-size:19px}</style>
<text x="48" y="70" class="title">Keep the edit aligned</text>
<text x="48" y="112" class="sub">Optional corrections run before the image reaches the gallery and saved PNG.</text>
<rect x="48" y="160" width="352" height="204" rx="14" fill="#1b2230" stroke="#3c4a63"/>
<text x="70" y="202" class="label">1  Source</text>
<text x="70" y="242" class="body">Upload in native img2img</text>
<text x="70" y="271" class="body">Extra references are optional</text>
<text x="70" y="300" class="body">Describe the intended edit</text>
<rect x="424" y="160" width="352" height="204" rx="14" fill="#1b2230" stroke="#3c4a63"/>
<text x="446" y="202" class="label">2  Generate</text>
<text x="446" y="242" class="body">Qwen produces the edit</text>
<text x="446" y="271" class="body">Optional Spectrum speedup</text>
<text x="446" y="300" class="body">Separate CFG histories</text>
<rect x="800" y="160" width="352" height="204" rx="14" fill="#1b2230" stroke="#3c4a63"/>
<text x="822" y="202" class="label">3  Finish</text>
<text x="822" y="242" class="body">Optional refiner pass</text>
<text x="822" y="271" class="body">Optional grid cleanup</text>
<text x="822" y="300" class="body">Preserve image alpha</text>
<rect x="48" y="390" width="352" height="204" rx="14" fill="#1b2230" stroke="#3c4a63"/>
<text x="70" y="432" class="label">4  Align</text>
<text x="70" y="472" class="body">PixelDriftFix-style matching</text>
<text x="70" y="501" class="body">Correct small framing shifts</text>
<text x="70" y="530" class="body">Skip uncertain or large warps</text>
<rect x="424" y="390" width="352" height="204" rx="14" fill="#1b2230" stroke="#3c4a63"/>
<text x="446" y="432" class="label">5  Composite</text>
<text x="446" y="472" class="body">Optional background blend</text>
<text x="446" y="501" class="body">Avoid a second alignment</text>
<text x="446" y="530" class="body">Review intentional changes</text>
<rect x="800" y="390" width="352" height="204" rx="14" fill="#1b2230" stroke="#3c4a63"/>
<text x="822" y="432" class="label">6  Save</text>
<text x="822" y="472" class="body">Same result in the gallery</text>
<text x="822" y="501" class="body">Alignment status in metadata</text>
<text x="822" y="530" class="body">No visual-quality guarantee</text>
<text x="48" y="704" class="sub">Alignment is off by default. Protected head swaps skip this pass; experimental mesh mode is not included.</text>
